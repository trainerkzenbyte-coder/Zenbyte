<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03050b">
<meta name="description" content="Zenbyte Technologies — Your Bridge to IT Careers. Placement support for MNCs and product-based companies across India.">
<title>Zenbyte Technologies — Your Bridge to IT Careers</title>
<link rel="icon" type="image/png" data-logo>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,600;0,800;0,900;1,300&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#03050b;--cyan:#22c4ff;--blue:#2a7fd6;--ice:#bfeeff;--gold:#ffd88a;--paper:#f3f6fb;--muted:#9fb0c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);overflow:hidden;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#fade{position:fixed;inset:0;pointer-events:none;background:#000;opacity:0;z-index:40}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:41;background:radial-gradient(circle at 60% 30%,#fff 0%,#e6f7ff 30%,rgba(140,210,255,.6) 60%,rgba(3,5,11,0) 90%)}

/* loader */
#load{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#03050b;transition:opacity 1s}
#load.off{opacity:0;pointer-events:none}
#load div{width:min(260px,60vw);text-align:center;font:600 .7rem Inter;letter-spacing:.3em;text-transform:uppercase;color:#8aa0c0}
#load i{display:block;height:2px;margin-top:1rem;background:#ffffff14;overflow:hidden}
#load i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .3s}

/* ---------- intro (space) overlay ---------- */
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(.4rem,1.5vh,1rem);padding:4vh 5vw;text-align:center;pointer-events:none}
.logo-wrap{position:relative;width:min(36vh,60vw);aspect-ratio:1;opacity:0}
.s-logo .logo-wrap{animation:logoIn 2.2s cubic-bezier(.16,.9,.2,1) forwards,logoFloat 6s ease-in-out 2.2s infinite}
@keyframes logoIn{0%{opacity:0;transform:scale(.12);filter:blur(26px) brightness(5)}35%{opacity:1;filter:blur(6px) brightness(2.6)}100%{opacity:1;transform:scale(1);filter:blur(0) brightness(1.06)}}
@keyframes logoFloat{50%{translate:0 -10px}}
.logo-glow{position:absolute;inset:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(190,238,255,.75) 14%,rgba(34,196,255,.32) 32%,rgba(42,127,214,.1) 50%,transparent 68%);animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.07);opacity:.85}}
.halo{position:absolute;inset:-14%;border-radius:50%;border:1px solid rgba(160,230,255,.3);box-shadow:0 0 40px rgba(34,196,255,.3)}
.halo::before{content:"";position:absolute;inset:-1px;border-radius:50%;background:conic-gradient(transparent 0 72%,rgba(255,255,255,.9) 79%,transparent 86%);-webkit-mask:radial-gradient(circle,transparent 69%,#000 70%);mask:radial-gradient(circle,transparent 69%,#000 70%);animation:spin 5s linear infinite}
.halo.h2{inset:-25%;border-color:rgba(255,216,138,.16);box-shadow:none}
.halo.h2::before{animation-duration:9s;animation-direction:reverse;background:conic-gradient(transparent 0 82%,rgba(255,216,138,.8) 87%,transparent 92%)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:relative;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 18px rgba(34,196,255,.7)) drop-shadow(0 0 50px rgba(34,196,255,.3))}
.burst{position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;border:2px solid rgba(200,240,255,.9);opacity:0}
.s-logo .burst{animation:burst 1.8s cubic-bezier(.1,.8,.3,1) forwards}.s-logo .burst.b2{animation-delay:.25s;border-color:rgba(255,216,138,.8)}
@keyframes burst{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(120)}}
.name{font-family:"Exo 2",sans-serif;font-weight:900;font-size:clamp(2rem,6vw,5rem);line-height:1;white-space:nowrap}
.name span{display:inline-block;opacity:0;transform:translateY(40px) rotateX(80deg);filter:blur(10px);background:linear-gradient(180deg,#fff 10%,#9fe4ff 55%,#2a8fe0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-name .name span{animation:letter .9s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*55ms)}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.tag{display:flex;align-items:center;gap:1rem;font-weight:700;font-size:clamp(.7rem,1.4vw,1rem);letter-spacing:.4em;text-transform:uppercase;color:var(--ice);opacity:0;transform:translateY(14px);transition:1s}
.tag::before,.tag::after{content:"";width:clamp(1.5rem,6vw,5rem);height:1px;background:linear-gradient(90deg,transparent,var(--cyan))}.tag::after{transform:scaleX(-1)}
.s-tag .tag{opacity:1;transform:none}
.quote{min-height:3em;max-width:46rem;font:italic 300 clamp(1rem,2vw,1.4rem)/1.45 "Exo 2",sans-serif;color:#e6f3ff;opacity:0;transition:opacity 1s}
.s-quote .quote{opacity:1}
.quote q{display:inline-block;transition:opacity .7s,filter .7s,transform .7s}.quote q::before,.quote q::after{color:var(--gold)}
.quote q.out{opacity:0;filter:blur(8px);transform:translateY(-8px)}
.cities{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#8fa3c4;opacity:0;transition:opacity 1s .4s}.s-quote .cities{opacity:1}
.cta{pointer-events:auto;margin-top:.4rem;padding:.95rem 2.1rem;border-radius:99px;border:1px solid rgba(160,230,255,.5);background:linear-gradient(135deg,rgba(34,196,255,.24),rgba(42,127,214,.12));font:700 .82rem Inter;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(8px);box-shadow:0 0 30px rgba(34,196,255,.3);opacity:0;transform:translateY(16px);transition:opacity 1s,transform 1s,box-shadow .3s}
.s-cta .cta{opacity:1;transform:none}.cta:hover{box-shadow:0 0 55px rgba(34,196,255,.75)}
.hint{position:fixed;left:50%;bottom:calc(1.3rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:21;font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:rgba(210,222,240,.55);transition:opacity .8s;pointer-events:none;white-space:nowrap}
body.office #intro,body.office .hint{opacity:0;pointer-events:none;transition:opacity 1s}
body.office #intro *{pointer-events:none!important}

/* ---------- office UI ---------- */
.ui{opacity:0;pointer-events:none;transition:opacity 1.2s}
body.office .ui{opacity:1}
body.office .ui>*{pointer-events:auto}
.top{position:fixed;z-index:30;top:0;left:0;right:0;display:flex;align-items:center;gap:1rem;padding:1rem clamp(1rem,3vw,2.5rem);background:linear-gradient(180deg,rgba(3,5,11,.7),transparent);pointer-events:none!important}
.brand{display:flex;align-items:center;gap:.7rem;pointer-events:auto}
.brand img{width:42px;height:42px;filter:drop-shadow(0 0 10px rgba(34,196,255,.5))}
.brand b{display:block;font:800 1rem "Exo 2";letter-spacing:.06em}
.brand small{display:block;font-size:.6rem;letter-spacing:.14em;color:var(--cyan);text-transform:uppercase}
#chap{margin-left:auto;display:flex;gap:.15rem;padding:.3rem;border:1px solid rgba(255,255,255,.14);border-radius:99px;background:rgba(10,14,28,.45);backdrop-filter:blur(12px);pointer-events:auto}
#chap button{border:0;background:none;padding:.4rem .75rem;border-radius:99px;font-size:.64rem;font-weight:700;color:#b5c2d8;cursor:pointer;white-space:nowrap;transition:.25s}
#chap button.on{background:rgba(255,255,255,.18);color:#fff}#chap button:hover{color:#fff}
#rail{position:fixed;z-index:30;right:clamp(.6rem,1.6vw,1.6rem);top:50%;transform:translateY(-50%);display:grid;gap:.42rem}
#rail button{width:.5rem;height:.5rem;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:.25s}
#rail button.on{background:var(--cyan);box-shadow:0 0 .8rem var(--cyan);transform:scale(1.5)}
.hud{position:fixed;z-index:30;left:clamp(1rem,3vw,2.5rem);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));min-width:11rem;padding:.6rem .9rem;border-radius:12px;background:rgba(5,8,18,.45);backdrop-filter:blur(10px)}
.hud small{display:block;font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hud b{display:block;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;margin:.15rem 0 .45rem}
.bar{height:2px;background:rgba(255,255,255,.18)}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold));transition:width .6s}
.cnt{font-size:.68rem;color:var(--muted);margin-top:.35rem;letter-spacing:.12em}
.arrows{position:fixed;z-index:30;right:clamp(2.2rem,4vw,4rem);bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));display:flex;gap:.55rem}
.arrows button{width:2.7rem;height:2.7rem;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(5,8,18,.55);backdrop-filter:blur(8px);cursor:pointer;font-size:1.05rem}
.arrows button:disabled{opacity:.3;cursor:default}
.walk{position:fixed;z-index:30;left:50%;bottom:5.4rem;transform:translateX(-50%);padding:.45rem 1rem;border-radius:99px;background:rgba(5,8,18,.55);backdrop-filter:blur(8px);font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ice);opacity:0;transition:opacity .5s;pointer-events:none!important}
body.walking .walk{opacity:1}

/* content panel */
#panel{position:fixed;z-index:25;top:5.6rem;bottom:5.2rem;width:min(44vw,640px);display:flex;flex-direction:column;justify-content:center;transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
#panel.left{left:clamp(1rem,3.5vw,3rem)}#panel.right{right:clamp(2.6rem,4.5vw,4.5rem)}
#panel.out{opacity:0;transform:translateY(18px)}
.card{max-height:100%;overflow:auto;scrollbar-width:thin;padding:clamp(1.1rem,2vw,1.8rem);border-radius:22px;background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.03)),rgba(8,12,26,.62);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);box-shadow:0 30px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.2)}
.ey{font-size:.68rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--cyan)}
.card h2{margin:.35rem 0 .55rem;font:800 clamp(1.5rem,2.7vw,2.4rem)/1.08 "Exo 2",sans-serif;letter-spacing:-.02em}
.card h2 em{font-style:normal;background:linear-gradient(90deg,#9cd8ff,#ffc28a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{color:#dbe5f5;font-weight:500;font-size:clamp(.86rem,1vw,.98rem);line-height:1.55;margin-bottom:1rem}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem}
.g.one{grid-template-columns:1fr}.g.three{grid-template-columns:repeat(3,1fr)}
.k{position:relative;padding:.85rem 1rem;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);animation:kin .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms)}
@keyframes kin{from{opacity:0;transform:translateY(16px) scale(.97)}}
.k b{display:block;font:800 1.5rem/1.1 "Exo 2";background:linear-gradient(90deg,#7cc4ff,#c79bff,#ffb38a);-webkit-background-clip:text;background-clip:text;color:transparent}
.k h4{font-size:.98rem;font-weight:700;line-height:1.3;margin:.15rem 0}
.k p{font-size:.84rem;line-height:1.5;color:#c9d4e6}
.k.w2{grid-column:1/-1}
.k.sm{display:flex;gap:.6rem;align-items:center;padding:.6rem .85rem}.k.sm b{font-size:1rem}.k.sm h4{margin:0;font-size:.88rem}
.k.tile{text-align:center;padding:1rem .8rem}.k.tile h4{font-size:1rem}
.k.big{text-align:center}.k.big b{font-size:2rem}
.k.step{display:grid;grid-template-columns:2.4rem 1fr;column-gap:.8rem;align-items:center}.k.step b{grid-row:1/span 2;font-size:2rem;text-align:center}
.k.faq{border-left:3px solid var(--cyan)}.k.faq h4{color:var(--ice)}
.cp{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}.cp span{padding:.18rem .5rem;border:1px solid rgba(255,255,255,.16);border-radius:99px;font-size:.68rem;color:#d3ddec}
.nt{margin-top:.8rem;font-size:.76rem;line-height:1.5;color:var(--muted)}
.stats{display:flex;gap:1.4rem;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}.stats b{display:block;font:800 1.6rem "Exo 2";color:#fff}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;margin:.8rem 0 .4rem}
.bg{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}.bp{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%}
.bp i{flex:1;height:0;border-radius:3px 3px 0 0;transition:height 1.1s cubic-bezier(.2,.8,.2,1) .3s;background:linear-gradient(#75f6ff,#1f8791)}.bp i+i{background:linear-gradient(#f5c463,#b8541f)}
.bg span{font-size:.56rem;color:var(--muted)}
.sk{display:grid;grid-template-columns:1fr 1fr;gap:.3rem .8rem;margin-top:.4rem}.sk div{position:relative;font-size:.72rem;padding:.25rem .4rem;border-radius:4px;overflow:hidden}
.sk i{position:absolute;inset:0 auto 0 0;width:0;background:rgba(117,246,255,.16);transition:width 1s ease .4s}.sk span{position:relative;display:flex;justify-content:space-between;gap:.5rem}
.cal input{width:100%;accent-color:#75f6ff;margin:.6rem 0}.cal .ct{font:800 2.2rem "Exo 2";color:#75f6ff}
.cr{display:grid;grid-template-columns:7.5rem 1fr 6.2rem;gap:.6rem;align-items:center;font-size:.8rem;margin:.5rem 0}.cr u{display:block;height:10px;border-radius:5px;background:#ffffff14;overflow:hidden;text-decoration:none}.cr u i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#75f6ff,#f5c463);transition:width .6s}.cr em{text-align:right;font-style:normal}
.trk{position:relative;height:6px;margin:2.6rem 4px 2rem;border-radius:3px;background:#ffffff1c}.trk i{position:absolute;left:8.3%;width:66.7%;height:100%;border-radius:3px;background:linear-gradient(90deg,#75f6ff,#f5c463)}.trk em{position:absolute;top:-7px;left:8.3%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 24px 6px #75f6ff;animation:run 3.4s ease-in-out infinite alternate}.trk span{position:absolute;top:18px;font-size:.64rem;color:var(--muted);transform:translateX(-50%)}
@keyframes run{to{left:75%}}
.big-n{font:800 3rem "Exo 2";background:linear-gradient(90deg,#7cc4ff,#ffb38a);-webkit-background-clip:text;background-clip:text;color:transparent}

@media (hover:none),(max-width:900px){.hint{font-size:.58rem}}
@media (max-width:900px){
 #chap{display:none}#rail{display:none}
 #panel{left:.7rem!important;right:.7rem!important;width:auto;top:auto;bottom:4.6rem;height:52vh}
 .card{border-radius:18px}.g.three{grid-template-columns:1fr}.g{grid-template-columns:1fr}
 .hud{bottom:.7rem;left:.7rem;min-width:0;padding:.4rem .7rem}.arrows{bottom:.7rem;right:.7rem}
 .walk{bottom:4rem}.name{font-size:7vw}.tag{letter-spacing:.24em}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

/* ================= REAL OFFICE (video) ================= */
#office{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0b0c10}
#look{position:absolute;inset:-20px;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
#stage{position:absolute;inset:0;will-change:transform}
#stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s;filter:contrast(1.06) saturate(1.06) brightness(.92)}
#stage video.on{opacity:1}
#stage.blurwalk video{filter:contrast(1.06) saturate(1.06) brightness(.92) blur(3px)}
.fallback{position:absolute;inset:0;display:none;place-items:center;background:radial-gradient(ellipse at 50% 40%,#1b2a44,#07090f 70%)}
.fallback img{width:min(40vh,50vw);opacity:.18;filter:blur(1px)}
body.novideo .fallback{display:grid}
.grade{position:absolute;inset:0;pointer-events:none;background:
 radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.55) 100%),
 linear-gradient(180deg,rgba(3,5,11,.55) 0%,transparent 18%,transparent 70%,rgba(3,5,11,.6) 100%)}
#grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:overlay;opacity:.5;image-rendering:pixelated}
#gl{z-index:1}

/* frameless glass doors with etched logo */
#doors{position:absolute;inset:0;pointer-events:none;perspective:1400px;visibility:hidden}
#doors.closed,#doors.closing,#doors.opening{visibility:visible}
#doors .leaf{position:absolute;top:0;bottom:0;width:50.4%;
 background:linear-gradient(105deg,rgba(255,255,255,.22),rgba(255,255,255,.07) 40%,rgba(255,255,255,.14) 60%,rgba(255,255,255,.05)),rgba(170,190,205,.18);
 backdrop-filter:blur(18px) saturate(1.25) brightness(1.08);-webkit-backdrop-filter:blur(18px) saturate(1.25) brightness(1.08);
 border:14px solid #15171b;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 0 60px rgba(255,255,255,.08),0 0 80px rgba(0,0,0,.6);transform-style:preserve-3d}
#doors .leaf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 38%,transparent 46%);pointer-events:none}
#doors .l{left:0;border-right-width:7px;transform-origin:0 50%}
#doors .r{right:0;border-left-width:7px;transform-origin:100% 50%}
#doors .bar{position:absolute;top:32%;height:36%;width:14px;border-radius:7px;background:linear-gradient(90deg,#7d838c,#f2f4f7 45%,#9aa1aa);box-shadow:0 6px 18px rgba(0,0,0,.45)}
#doors .l .bar{right:26px}#doors .r .bar{left:26px}
#doors .etch{position:absolute;top:50%;width:min(30vh,34vw);aspect-ratio:1;margin-top:calc(min(30vh,34vw)/-2);background:var(--logo) no-repeat;background-size:200% 100%;opacity:.55;filter:grayscale(1) brightness(2.4) contrast(.6);mix-blend-mode:screen}
#doors .l .etch{right:0;background-position:0 0}#doors .r .etch{left:0;background-position:100% 0}
#doors .sign{position:absolute;z-index:2;left:50%;top:8vh;transform:translateX(-50%);padding:.7rem 1.6rem;border-radius:6px;background:rgba(10,12,16,.85);border:1px solid rgba(255,255,255,.12);font:700 clamp(.7rem,1.2vw,.95rem) Inter;letter-spacing:.32em;color:#e9eef6;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#doors .sign::before{content:"";display:inline-block;width:.5rem;height:.5rem;border-radius:50%;background:#22c4ff;box-shadow:0 0 10px #22c4ff;margin-right:.8rem;vertical-align:middle}
#doors.closing .l{animation:closeL 1.1s cubic-bezier(.3,.7,.2,1) both}#doors.closing .r{animation:closeR 1.1s cubic-bezier(.3,.7,.2,1) both}
#doors.closing .sign{animation:fadeIn .8s both}
#doors.opening .l{animation:openL 1.7s cubic-bezier(.55,.05,.3,1) both}#doors.opening .r{animation:openR 1.7s cubic-bezier(.55,.05,.3,1) both}
#doors.opening .sign{animation:signOut 1.2s both}
@keyframes closeL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes closeR{from{transform:translateX(100%)}to{transform:none}}
@keyframes openL{0%{transform:none}100%{transform:translateX(-35%) rotateY(78deg) scale(1.25);opacity:0}}
@keyframes openR{0%{transform:none}100%{transform:translateX(35%) rotateY(-78deg) scale(1.25);opacity:0}}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-10px)}}
@keyframes signOut{to{opacity:0;transform:translate(-50%,-40px) scale(1.2)}}
body:not(.office) #office{visibility:hidden}

</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<body>
<!-- real office footage (behind everything) -->
<div id="office" aria-hidden="true">
  <div id="look"><div id="stage">
    <video id="vA" muted loop playsinline preload="auto"></video>
    <video id="vB" muted loop playsinline preload="auto"></video>
  </div></div>
  <div class="fallback"><img data-logo alt=""></div>
  <div class="grade"></div><canvas id="grain"></canvas>
  <div id="doors">
    <div class="sign"><span id="sign"></span></div>
    <div class="leaf l"><i class="bar"></i><i class="etch"></i></div>
    <div class="leaf r"><i class="bar"></i><i class="etch"></i></div>
  </div>
</div>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="flash" aria-hidden="true"></div>
<div id="fade" aria-hidden="true"></div>

<div id="load"><div>Preparing the universe<i><b id="lbar"></b></i></div></div>

<!-- PART 1: space intro -->
<main id="intro" aria-label="Zenbyte Technologies">
  <div class="logo-wrap">

  halo.position.copy(person.position); halo.position.y += ph * .5 * ps; halo.material.opacity = gl * pv * (.7 + .2 * Math.sin(rt * 6)); halo.scale.setScalar(ph * (1.6 + asc * 2) * ps + 2);
  /* flash */
  $('flash').style.opacity = bell(T, 14.05, .3).toFixed(3);
  /* warp into the office */
  if (warp >= 0) {
    warp += dt; const w = cl(warp / 2.2);
    starU.uWarp.value = w * w; sCam.fov = (sCam.aspect < .9 ? 62 : 45) + w * w * 50; sCam.updateProjectionMatrix();
    sCam.position.lerp(S.star, w * w * .9);
    B.classList.add('leaving'); $('fade').style.opacity = cl((warp - 1.6) / .6).toFixed(3); $('fade').style.background = '#fff';
    if (warp > 2.3) enterOffice();
  }
}
/* ======================================================================
   PART 2 — THE REAL ZENBYTE OFFICE (real filmed video, one room per chapter)
   ----------------------------------------------------------------------
   Each room plays a real office video. The site first looks for YOUR clip
   in the  videos/  folder (videos/room1.mp4 … videos/room7.mp4). If that
   file is not there yet, it uses the free Mixkit clip listed below.
   ====================================================================== */
const ROOM_VIDEO = [
  { id: 917,   title: 'Open office space and staircase' },          // 1 Welcome (lobby)
  { id: 918,   title: 'Busy office space' },                        // 2 Our record
  { id: 42617, title: 'People working in the office' },             // 3 Your journey
  { id: 4872,  title: 'Two coworkers talking and laughing' },       // 4 Visits and timing
  { id: 4547,  title: 'People having a work meeting around a table' }, // 5 Fees
  { id: 313,   title: 'Colleagues reading a report together' },     // 6 Policies
  { id: 30010, title: 'Two office men approving data with a handshake' } // 7 Rewards
];
const srcList = k => [`videos/room${k + 1}.mp4`, `https://assets.mixkit.co/videos/${ROOM_VIDEO[k].id}/${ROOM_VIDEO[k].id}-720.mp4`];

const vids = [$('vA'), $('vB')], stageEl = $('stage'), doorsEl = $('doors');
let front = 0;                       // index of the visible <video>
const loaded = [-1, -1];             // which room each <video> holds
const inflight = [null, null];
function loadRoom(vi, k) {
  const v = vids[vi];
  if (loaded[vi] === k) return Promise.resolve(true);
  if (inflight[vi] && inflight[vi].k === k) return inflight[vi].p;
  const p = new Promise(res => {
    const list = srcList(k); let i = 0, finished = false;
    const fin = ok => { if (finished) return; finished = true; v.onloadeddata = v.onerror = null; loaded[vi] = ok ? k : -1; if (vi === front) B.classList.toggle('novideo', !ok); res(ok); };
    const next = () => { if (i >= list.length) return fin(false); v.src = list[i++]; v.load(); };
    v.onloadeddata = () => fin(true); v.onerror = next; next();
    setTimeout(() => fin(v.readyState >= 2), 12000);
  });
  inflight[vi] = { k, p }; p.then(() => { if (inflight[vi] && inflight[vi].p === p) inflight[vi] = null; });
  return p;
}
function view(i) {
  const k = PAGE_ROOM[i], r = ROOMS[k], j = r.pages.indexOf(i), n = r.pages.length;
  const OX = [50, 32, 68, 40, 62, 50], OY = [50, 42, 55, 60, 45, 50];
  return { s: 1.04 + j * .045, ox: OX[j % 6], oy: OY[j % 6], t: j / n };
}
function frame(v, s, ox, oy, ms) {
  stageEl.style.transition = `transform ${ms}ms cubic-bezier(.25,.8,.25,1), filter ${ms}ms`;
  stageEl.style.transformOrigin = `${ox}% ${oy}%`;
  stageEl.style.transform = `scale(${s})`;
}
function seek(v, t) { if (v.duration && isFinite(v.duration)) v.currentTime = Math.max(0, Math.min(v.duration - .5, t * v.duration)); }

let page = -1, busy = false, queued = null;
const wait = ms => new Promise(r => setTimeout(r, ms));
async function go(i, first) {
  i = Math.max(0, Math.min(P.length - 1, i));
  if (busy) { queued = i; return; }
  if (i === page && !first) return;
  busy = true;
  const kA = first ? -1 : PAGE_ROOM[page], kB = PAGE_ROOM[i], V = view(i);
  page = i; updateNav(); hidePanel();
  if (kA !== kB) {
    /* ---- walk to a glass door, it opens, walk into the next room ---- */
    B.classList.add('walking');
    $('sign').textContent = String(kB + 1).padStart(2, '0') + '  ·  ' + ROOMS[kB].name.toUpperCase();
    const back = 1 - front;
    const ready = loadRoom(back, kB);                                  // start loading next room now
    if (!first) { stageEl.classList.add('blurwalk'); frame(vids[front], 1.32, 50, 50, 1100); doorsEl.className = 'closing'; await wait(1150); }
    else { doorsEl.className = 'closed'; await wait(60); }
    await ready;
    vids[back].currentTime = 0; seek(vids[back], V.t); vids[back].play().catch(() => {});
    vids[front].classList.remove('on'); vids[back].classList.add('on'); vids[front].pause(); front = back;
    B.classList.toggle('novideo', loaded[front] !== kB);
    stageEl.style.transition = 'none'; stageEl.style.transformOrigin = '50% 50%'; stageEl.style.transform = 'scale(1.32)'; stageEl.classList.add('blurwalk');
    await wait(first ? 700 : 350);
    doorsEl.className = 'opening';
    requestAnimationFrame(() => { stageEl.classList.remove('blurwalk'); frame(vids[front], V.s, V.ox, V.oy, 2600); });
    await wait(1700); B.classList.remove('walking'); doorsEl.className = '';
    showPanel(i);
    await wait(600);
    /* preload the following room in the hidden player */
    if (kB + 1 < ROOMS.length) loadRoom(1 - front, kB + 1);
  } else {
    /* ---- move to another spot inside the same room ---- */
    stageEl.classList.add('blurwalk'); frame(vids[front], V.s + .12, V.ox, V.oy, 700); await wait(520);
    seek(vids[front], V.t);
    stageEl.classList.remove('blurwalk'); frame(vids[front], V.s, V.ox, V.oy, 1600);
    await wait(500); showPanel(i);
  }
  busy = false;
  if (queued !== null) { const q = queued; queued = null; go(q); }
}
function hidePanel() { $('panel').classList.add('out'); }
function showPanel(i) {
  const el = $('panel'), side = i % 2 === 0 ? 'right' : 'left';
  el.className = side + ' out'; el.innerHTML = pageHTML(i); afterRender(i, el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.remove('out')));
}
function enterOffice() {
  if (mode === 'office') return;
  mode = 'office'; B.classList.add('office'); clearInterval(qTimer);
  const f = $('fade'); f.style.transition = 'opacity 1.8s';
  setTimeout(() => { f.style.opacity = 0; canvas.style.display = 'none'; }, 300);
  go(0, true);
}

/* --- office UI --- */
const chap = $('chap'), rail = $('rail');
chap.innerHTML = ROOMS.map((r, k) => `<button data-k="${k}">${E(r.name)}</button>`).join('');
rail.innerHTML = P.map((p, i) => `<button data-i="${i}" aria-label="Go to page ${i + 1}"></button>`).join('');
chap.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(ROOMS[+b.dataset.k].pages[0]); });
rail.addEventListener('click', e => { const b = e.target.closest('button'); if (b) go(+b.dataset.i); });
$('prev').onclick = () => go(page - 1); $('next').onclick = () => go(page + 1);
function updateNav() {
  [...chap.children].forEach((b, k) => b.classList.toggle('on', k === PAGE_ROOM[page]));
  [...rail.children].forEach((b, i) => b.classList.toggle('on', i === page));
  $('hudT').textContent = P[page].e; $('hudB').style.width = ((page + 1) / P.length * 100) + '%';
  $('hudN').textContent = String(page + 1).padStart(2, '0') + ' / ' + P.length + '  ·  Room ' + (PAGE_ROOM[page] + 1);
  $('prev').disabled = page === 0; $('next').disabled = page === P.length - 1;
}
let wheelLock = 0;
addEventListener('wheel', e => {
  if (mode !== 'office') { if (mode === 'space' && e.deltaY > 30) skip(); return; }
  const c = e.target.closest('.card'); if (c && c.scrollHeight > c.clientHeight + 4) return;
  const n = Date.now(); if (n < wheelLock || Math.abs(e.deltaY) < 10 || busy) return; wheelLock = n + 1100; go(page + (e.deltaY > 0 ? 1 : -1));
}, { passive: true });
addEventListener('keydown', e => {
  if (mode === 'space') { if ([' ', 'Enter', 'Escape'].includes(e.key)) { e.preventDefault(); if (T >= END && e.key === 'Enter') $('cta').click(); else skip(); } return; }
  if (mode !== 'office') return;
  if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(page + 1); }
  else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(page - 1); }
  else if (e.key === 'Home') go(0); else if (e.key === 'End') go(P.length - 1);
});
let ty0 = 0; addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; }, { passive: true });
addEventListener('touchend', e => { if (mode !== 'office' || e.target.closest('.card')) return; const d = ty0 - e.changedTouches[0].clientY; if (Math.abs(d) > 50) go(page + (d > 0 ? 1 : -1)); }, { passive: true });
/* gentle "head movement" with the mouse */
addEventListener('pointermove', e => { if (mode === 'office') $('look').style.transform = `translate(${(e.clientX / innerWidth - .5) * -14}px,${(e.clientY / innerHeight - .5) * -9}px)`; });
document.addEventListener('visibilitychange', () => { if (mode === 'office') document.hidden ? vids[front].pause() : vids[front].play().catch(() => {}); });

/* film grain for the real footage */
(function grain() {
  const c = $('grain'), x = c.getContext('2d'); c.width = c.height = 160; const d = x.createImageData(160, 160);
  let f = 0; (function tick() { if (mode === 'office' && f++ % 3 === 0) { for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 22; } x.putImageData(d, 0, 0); } requestAnimationFrame(tick); })();
})();

/* ======================================================================
   START
   ====================================================================== */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last) / 1000); last = now; rt += dt;
  if (mode !== 'space') return;
  spaceFrame(dt);
  film.uniforms.uT.value = rt % 100;
  composer.render();
}
Promise.all([loadTex('earth-blue-marble.jpg'), loadTex('earth-night.jpg'), loadTex('earth-water.png', false), loadTex('night-sky.png'), logoImg.decode().catch(() => {}), document.fonts.ready])
  .then(([day, night, water, skyT]) => {
    if (day && night && water) { earthU.uDay.value = day; earthU.uNight.value = night; earthU.uSpec.value = water; earthU.uHas.value = 1; }
    if (skyT) { skyMat.map = skyT; skyMat.needsUpdate = true; sky.visible = true; }
    renderer.compile(space, sCam);
    $('load').classList.add('off'); mode = 'space';
    loadRoom(1, 0);   /* start downloading the first office video during the intro */
    if (matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash === '#office') { T = END; $('fade').style.background = '#000'; $('fade').style.opacity = 1; enterOffice(); }
  });
requestAnimationFrame(loop);

</script>
