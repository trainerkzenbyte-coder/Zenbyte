<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="description" content="Zenbyte Technologies — Your Bridge to IT Careers. Placement support for MNCs and product-based companies across India.">
<title>Zenbyte Technologies — Your Bridge to IT Careers</title>
<link rel="icon" type="image/png" data-logo>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,600;0,800;0,900;1,300&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
__CSS__
</style>
</head>
<body>
<!-- the real Zenbyte office (your walkthrough video) -->
<div id="scene" aria-hidden="true">
  <video id="walk" muted playsinline webkit-playsinline preload="auto" poster="media/poster.jpg"></video>
  <div class="grade"></div><canvas id="grain"></canvas>
</div>

<!-- the computer on the desk -->
<div id="desk" aria-hidden="true">
  <div id="mon">
    <div class="halo-light"></div>
    <div class="bezel"><div class="screen" id="screen"><div class="vd-wrap"><div class="vd-bar"><img data-logo alt=""><b>Zenbyte Technologies</b><span>zenbyte.in</span></div><div class="vd" id="vd"></div></div><i class="glare"></i></div><div class="chin"><img data-logo alt=""></div></div>
    <div class="neck"></div><div class="foot"></div><div class="shadow"></div>
  </div>
</div>

<!-- the page, full screen after zooming into the computer -->
<section id="full" aria-live="polite"></section>

<!-- intro: logo first -->
<main id="intro" aria-label="Zenbyte Technologies">
  <div class="logo-wrap">
    <div class="logo-glow"></div><div class="halo h2"></div><div class="halo"></div>
    <img class="logo" id="logo" alt="Zenbyte Technologies logo" src="data:image/png;base64,__LOGO__">
  </div>
  <h1 class="name" id="name">Zenbyte Technologies</h1>
  <div class="tag">Your Bridge to IT Careers</div>
  <p class="quote"><q id="q"></q></p>
  <div class="cities">Chennai · Coimbatore · Bengaluru · Across India</div>
</main>
<button class="cta" id="cta" type="button">Enter Zenbyte →</button>

<!-- office UI -->
<div class="ui">
  <header class="top">
    <div class="brand"><img data-logo alt=""><div><b>Zenbyte Technologies</b><small>Your Bridge to IT Careers</small></div></div>
    <nav id="chap" aria-label="Rooms"></nav>
  </header>
  <nav id="rail" aria-label="Pages"></nav>
  <div class="walk">Walking to <b id="walkTo"></b>…</div>
  <aside class="hud" aria-live="polite"><small>Current page</small><b id="hudT"></b><div class="bar"><span id="hudB"></span></div><div class="cnt" id="hudN"></div></aside>
  <div class="arrows"><button id="prev" aria-label="Previous page">↑</button><button id="next" aria-label="Next page">↓</button></div>
</div>
<div id="blink" aria-hidden="true"></div>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center">Please enable JavaScript to view Zenbyte Technologies.</p></noscript>
<script>
__JS__
</script>
</body>
</html>
